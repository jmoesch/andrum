<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
[hidden] { display: none !important; }
</style>
<title>Andrum</title>
<meta name="theme-color" content="#0e1820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Andrum">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/andrum-180.png">
<link rel="icon" href="./icons/andrum-192.png">
<style>
@font-face {
  font-family: 'Figtree';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(./fonts/figtree-0.ttf) format('truetype');
}
@font-face {
  font-family: 'Figtree';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url(./fonts/figtree-1.ttf) format('truetype');
}
@font-face {
  font-family: 'Figtree';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url(./fonts/figtree-2.ttf) format('truetype');
}
@font-face {
  font-family: 'Literata';
  font-style: italic;
  font-weight: 300;
  font-display: swap;
  src: url(./fonts/literata-3.ttf) format('truetype');
}
@font-face {
  font-family: 'Literata';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url(./fonts/literata-4.ttf) format('truetype');
}

/* Layout: one calm night-sea screen; breathing disc in the middle, settings below. Deliberately dark-only. */
:root {
  --bg: #0e1820;
  --bg-2: #15232d;
  --line: #24363f;
  --fg: #e4ebe8;
  --muted: #8b9ca2;
  --in: #ead9a8;      /* bright bell, inhale */
  --out: #5f9aa0;     /* dark bell, exhale */
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "Figtree", -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app {
  max-width: 440px;
  min-height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-block: 20px 28px;
  box-sizing: border-box;
}
header { display: flex; justify-content: space-between; align-items: baseline; }
h1 {
  font-family: var(--display);
  font-style: italic;
  font-weight: 400;
  font-size: 1.5rem;
  margin: 0;
}


/* Breathing disc */
.stage {
  position: relative;
  width: 100%;
  max-width: 320px;
  aspect-ratio: 1;
  margin: 0 auto;
  display: grid;
  place-items: center;
}
.guide {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 1px dashed var(--line);
}
.disc {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--c, var(--out)) 55%, transparent), color-mix(in srgb, var(--c, var(--out)) 14%, transparent) 70%);
  box-shadow: 0 0 60px color-mix(in srgb, var(--c, var(--out)) 25%, transparent);
  transform: scale(0.5);
  will-change: transform;
}
.readout { position: relative; text-align: center; display: grid; gap: 2px; }
.phase {
  font-family: var(--display);
  font-style: italic;
  font-weight: 300;
  font-size: 1.6rem;
}
.count {
  font-family: var(--display);
  font-weight: 300;
  font-size: 3.4rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.session { display: grid; gap: 8px; }
.session-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0%; background: var(--fg); opacity: 0.6; }

/* Controls */
.controls { display: grid; gap: 16px; }
.group { display: grid; gap: 8px; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1 1 0;
  min-width: 52px;
  padding: 11px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg);
  font: 500 0.95rem var(--body);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg button:disabled { opacity: 0.4; cursor: default; }
.seg small { display: block; font-weight: 400; font-size: 0.7rem; opacity: 0.75; margin-top: 2px; }

.vol { display: flex; align-items: center; gap: 12px; }
.vol input { flex: 1; accent-color: var(--in); }
.vol button {
  border: 1px solid var(--line); background: transparent; color: var(--fg);
  border-radius: 999px; padding: 7px 12px; font: 500 0.8rem var(--body); cursor: pointer; white-space: nowrap;
}

.actions { display: flex; gap: 10px; margin-top: 4px; }
.primary, .secondary {
  padding: 16px; border-radius: 999px; font: 600 1rem var(--body); cursor: pointer; border: 0;
}
.primary { flex: 1; background: var(--in); color: var(--bg); }
.secondary { background: var(--bg-2); color: var(--fg); border: 1px solid var(--line); padding-inline: 22px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--in); outline-offset: 2px; }

.hint:empty { display: none; }
.hint { color: var(--muted); font-size: 0.8rem; line-height: 1.5; margin: 0; }

.app.in-session { min-height: calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
.in-session .stage { max-width: min(100%, 54svh); margin-block: auto; }
.in-session.details-open .stage { max-width: min(100%, 42svh); }
.stage-toggle { position: absolute; inset: 0; border: 0; background: transparent; border-radius: 50%; cursor: pointer; }
.in-session #timeGroup, .in-session #test, .in-session #mixGroup > label { display: none; }
.in-session #mixGroup:has(.hint:empty):has(#retryWake[hidden]) { display: none; }
.in-session:not(.details-open) :is(#sessionProgress, #volumeGroup) { display: none; }
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>Andrum</h1>
  </header>

  <div class="stage" aria-live="polite">
    <div class="guide"></div>
    <div class="disc" id="disc"></div>
    <div class="readout">
      <div class="phase" id="phase">Redo</div>
      <div class="count" id="count">10:00</div>
    </div>
    <button type="button" class="stage-toggle" id="detailsToggle" aria-label="Volym och återstående tid" aria-controls="volumeGroup sessionProgress" aria-expanded="false" hidden></button>
  </div>

  <div class="session" id="sessionProgress">
    <div class="session-row"><span id="elapsed">0:00</span><span id="remaining">10:00 kvar</span></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="controls">
    <div class="group" id="timeGroup">
      <span class="label">Tid</span>
      <div class="seg" id="times">
        <button type="button" id="t1" data-min="1">1 min</button>
        <button type="button" id="t3" data-min="3">3 min</button>
        <button type="button" id="t5" data-min="5">5 min</button>
        <button type="button" id="t10" data-min="10">10 min</button>
        <button type="button" id="t15" data-min="15">15 min</button>
        <button type="button" id="t20" data-min="20">20 min</button>
      </div>
    </div>
    <div class="group" id="volumeGroup">
      <label class="label" for="vol">Klockvolym · <output id="volumeValue" for="vol">70 %</output></label>
      <div class="vol">
        <input type="range" id="vol" min="0" max="1" step="0.05" value="0.7">
        <button type="button" id="test">Provlyssna</button>
      </div>
    </div>
    <div class="group" id="mixGroup" hidden>
      <label><input type="checkbox" id="mix"> Bakgrundsmusik</label>
      <p class="hint" id="wakeStatus" role="status"></p>
      <button type="button" id="retryWake" hidden>Försök igen</button>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="start">Starta</button>
      <button type="button" class="secondary" id="stop" hidden>Avsluta</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const disc = $('disc'), phaseEl = $('phase'), countEl = $('count');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  const pattern = Object.freeze({ in: 4, out: 6 });
  let minutes = store.get('minutes', 10);
  let volume = store.get('volume', 0.7);
  volume = Number.isFinite(volume) ? Math.max(0, Math.min(1, volume)) : 0.7;
  $('vol').value = volume;
  $('volumeValue').textContent = Math.round(volume * 100) + ' %';

  // The whole session is rendered to one audio file and played through an
  // ordinary <audio> element. iPhone keeps that playing with the screen locked
  // (Web Audio and timers stop there), and the file's own clock keeps the
  // 4–6 rhythm exact.
  const SR = 22050;
  const LEAD = 0.3;                // seconds of silence before the first bell

  let R = null;                    // rendered bell sounds: { in, out, end }
  let state = 'idle';              // idle | running | paused | done
  let cycles = 0, raf = 0, sessionUrl = null, previewUrl = null;
  const player = new Audio();
  const previewer = new Audio();
  player.preload = previewer.preload = 'auto';
  let mixAvailable = false;
  try {
    if (navigator.audioSession) {
      navigator.audioSession.type = 'ambient';
      mixAvailable = navigator.audioSession.type === 'ambient';
      $('mix').checked = mixAvailable && store.get('mixMusic', false) === true;
      navigator.audioSession.type = $('mix').checked ? 'ambient' : 'playback';
    }
  } catch {}
  $('mixGroup').hidden = !mixAvailable;
  $('mix').addEventListener('change', () => {
    previewer.pause();
    player.pause();
    navigator.audioSession.type = $('mix').checked ? 'ambient' : 'playback';
    store.set('mixMusic', $('mix').checked);
    keepAwake = $('mix').checked;
    syncWakeLock();
  });

  let keepAwake = $('mix').checked;
  let wakeLock = null;
  let wakePending = false;
  const needsWakeLock = () => keepAwake && $('mix').checked &&
    document.visibilityState === 'visible';

  async function syncWakeLock() {
    const status = $('wakeStatus');
    if (!needsWakeLock()) {
      const previous = wakeLock;
      wakeLock = null;
      if (previous) await previous.release().catch(() => {});
      status.textContent = '';
      $('retryWake').hidden = true;
      return;
    }
    if (wakeLock && !wakeLock.released) return;
    if (wakePending) return;
    if (!navigator.wakeLock) {
      status.textContent = 'Skärmlås stöds inte här.';
      return;
    }
    wakePending = true;
    status.textContent = '';
    try {
      const lock = await navigator.wakeLock.request('screen');
      if (!needsWakeLock()) {
        await lock.release();
        return;
      }
      wakeLock = lock;
      status.textContent = '';
      lock.addEventListener('release', () => {
        if (wakeLock !== lock) return;
        wakeLock = null;
        status.textContent = needsWakeLock()
          ? 'Skärmen kan släckas.'
          : '';
        $('retryWake').hidden = !needsWakeLock();
      });
      $('retryWake').hidden = true;
    } catch {
      status.textContent = 'Kunde inte hålla skärmen vaken.';
      $('retryWake').hidden = false;
    } finally {
      wakePending = false;
    }
  }
  $('retryWake').addEventListener('click', syncWakeLock);
  document.addEventListener('visibilitychange', syncWakeLock);
  window.addEventListener('pageshow', syncWakeLock);
  syncWakeLock();

  // Encode the level in the audio itself. A volume property's readback
  // cannot establish that the device actually applies it to playback.
  const audioScale = () => levelFor(pattern) * volume;
  let replacingAudio = false;

  function replaceAudio(audio, nextUrl, position, resume) {
    replacingAudio = true;
    audio.src = nextUrl;
    const seek = () => {
      if (audio.src !== nextUrl) return;
      try { audio.currentTime = position; } catch {}
      replacingAudio = false;
    };
    if (audio.readyState >= 1) seek();
    else audio.addEventListener('loadedmetadata', seek, { once: true });
    if (resume) audio.play().catch(() => {
      replacingAudio = false;
      if (audio === player && audio.src === nextUrl && state === 'running') {
        state = 'paused';
        phaseEl.textContent = 'Paus';
        render();
      }
    });
  }

  const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const cycleLen = () => pattern.in + pattern.out;
  const eventTime = k => Math.floor(k / 2) * cycleLen() + (k % 2 ? pattern.in : 0);

  async function loadBells() {
    const Decoder = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const decoder = new Decoder(1, 1, SR);
    async function loadStrike(name) {
      const response = await fetch('./sounds/' + name + '.wav');
      if (!response.ok) throw new Error('Missing recording: ' + name);
      const audio = await decoder.decodeAudioData(await response.arrayBuffer());
      return audio.getChannelData(0);
    }
    const [inhale, exhale] = await Promise.all([loadStrike('in'), loadStrike('out')]);
    const ending = new Float32Array(Math.max(inhale.length, Math.round(2.4 * SR) + exhale.length));
    for (const [clip, seconds, gain] of [[inhale, 0, 0.8], [exhale, 1.2, 0.8], [exhale, 2.4, 0.6]]) {
      const offset = Math.round(seconds * SR);
      for (let i = 0; i < clip.length; i++) ending[offset + i] += clip[i] * gain;
    }
    R = { in: inhale, out: exhale, end: ending };
  }

  // ---- Mixing to a WAV file ----
  function mixBlocks(events, n, sink) {
    const B = 16384, tmp = new Float32Array(B);
    for (let s = 0; s < n; s += B) {
      const e = Math.min(n, s + B);
      tmp.fill(0);
      for (const ev of events) {
        if (ev.start >= e) break;
        const a = Math.max(s, ev.start), b = Math.min(e, ev.start + ev.buf.length);
        const buf = ev.buf, off = ev.start;
        for (let i = a; i < b; i++) tmp[i - s] += buf[i - off];
      }
      sink(tmp, s, e - s);
    }
  }

  const levelCache = {};
  function levelFor(p) {
    // Scale so the loudest overlap of bells (steady rhythm + closing chime) peaks at 90%.
    const key = p.in + '-' + p.out;
    if (levelCache[key]) return levelCache[key];
    const cyc = p.in + p.out, evs = [];
    for (let k = 0; k < 12; k++) evs.push({ start: Math.round((Math.floor(k / 2) * cyc + (k % 2 ? p.in : 0)) * SR), buf: k % 2 ? R.out : R.in });
    evs.push({ start: Math.round(6 * cyc * SR), buf: R.end });
    const n = evs[12].start + R.end.length;
    let pk = 0;
    mixBlocks(evs, n, (b, s, len) => { for (let i = 0; i < len; i++) { const v = b[i] < 0 ? -b[i] : b[i]; if (v > pk) pk = v; } });
    return (levelCache[key] = 0.9 / (pk || 1));
  }

  function toWavUrl(events, n, scale) {
    const ab = new ArrayBuffer(44 + n * 2), dv = new DataView(ab);
    const w = (o, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(o + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); w(8, 'WAVE');
    w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, SR, true); dv.setUint32(28, SR * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    w(36, 'data'); dv.setUint32(40, n * 2, true);
    const out = new Int16Array(ab, 44, n);
    mixBlocks(events, n, (b, s, len) => {
      for (let i = 0; i < len; i++) {
        let v = b[i] * scale;
        out[s + i] = (v > 1 ? 1 : v < -1 ? -1 : v) * 32767;
      }
    });
    return URL.createObjectURL(new Blob([ab], { type: 'audio/wav' }));
  }

  function sessionUrlFor() {
    const evs = [];
    for (let k = 0; k < cycles * 2; k++) evs.push({ start: Math.round((LEAD + eventTime(k)) * SR), buf: k % 2 ? R.out : R.in });
    evs.push({ start: Math.round((LEAD + cycles * cycleLen()) * SR), buf: R.end });
    const last = evs[evs.length - 1];
    return toWavUrl(evs, last.start + last.buf.length, audioScale());
  }

  // ---- UI ----
  const app = document.querySelector('.app');
  const detailsToggle = $('detailsToggle');
  detailsToggle.addEventListener('click', () => {
    const expanded = app.classList.toggle('details-open');
    detailsToggle.setAttribute('aria-expanded', String(expanded));
  });

  function render() {
    document.querySelectorAll('#times button').forEach(b =>
      b.setAttribute('aria-pressed', +b.dataset.min === minutes));
    const locked = state === 'running' || state === 'paused';
    document.querySelectorAll('#times button').forEach(b => b.disabled = locked);
    app.classList.toggle('in-session', locked);
    detailsToggle.hidden = !locked;
    if (!locked) {
      app.classList.remove('details-open');
      detailsToggle.setAttribute('aria-expanded', 'false');
    }
    $('mix').disabled = locked;
    $('test').disabled = locked || !R;
    $('start').disabled = !R;
    $('start').textContent = !R ? 'Förbereder ljud…' : state === 'running' ? 'Paus' : state === 'paused' ? 'Fortsätt' : state === 'done' ? 'Starta igen' : 'Starta';
    $('stop').hidden = !locked;
    if (state === 'idle') {
      phaseEl.textContent = 'Redo';
      countEl.textContent = fmt(minutes * 60);
      $('elapsed').textContent = '0:00';
      $('remaining').textContent = fmt(minutes * 60) + ' kvar';
      $('bar').style.width = '0%';
      disc.style.setProperty('--c', 'var(--out)');
      disc.style.transform = 'scale(0.5)';
    }
  }

  // Smooth the player's clock between its updates so the circle moves evenly.
  let ctSeen = -1, ctAt = 0;
  function mediaTime() {
    const ct = player.currentTime, t = performance.now() / 1000;
    if (ct !== ctSeen) { ctSeen = ct; ctAt = t; return ct; }
    return player.paused ? ct : ct + Math.min(0.3, t - ctAt);
  }

  function frame() {
    if (state !== 'running') return;
    const cyc = cycleLen(), total = cycles * cyc;
    const e = Math.max(0, mediaTime() - LEAD);
    if (e >= total) { finish(); return; }
    const c = e % cyc;
    const inhale = c < pattern.in;
    const p = inhale ? c / pattern.in : (c - pattern.in) / pattern.out;
    const ease = (1 - Math.cos(Math.PI * p)) / 2;
    const s = inhale ? 0.5 + 0.5 * ease : 1 - 0.5 * ease;
    disc.style.transform = reduced ? 'scale(0.8)' : `scale(${s.toFixed(4)})`;
    disc.style.setProperty('--c', inhale ? 'var(--in)' : 'var(--out)');
    phaseEl.textContent = inhale ? 'Andas in' : 'Andas ut';
    countEl.textContent = Math.ceil((inhale ? pattern.in - c : cyc - c) - 0.001);
    $('elapsed').textContent = fmt(e);
    $('remaining').textContent = fmt(total - e) + ' kvar';
    $('bar').style.width = (100 * e / total).toFixed(2) + '%';
    raf = requestAnimationFrame(frame);
  }

  function setMediaSession() {
    if (!('mediaSession' in navigator)) return;
    if ($('mix').checked) {
      try {
        navigator.mediaSession.metadata = null;
        for (const action of ['play', 'pause', 'stop']) navigator.mediaSession.setActionHandler(action, null);
      } catch {}
      return;
    }
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Andrum',
        artist: `${minutes} min`,
        artwork: [{ src: "./icons/andrum-512.png", sizes: "512x512", type: "image/png" }]
      });
    } catch {}
    const on = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch {} };
    on('play', () => player.play());
    on('pause', () => player.pause());
    on('stop', stop);
  }

  function start() {
    if (!R) return;
    keepAwake = $('mix').checked;
    syncWakeLock();
    previewer.pause();
    cycles = Math.ceil(minutes * 60 / cycleLen());
    if (sessionUrl) URL.revokeObjectURL(sessionUrl);
    sessionUrl = sessionUrlFor();
    player.src = sessionUrl;
    ctSeen = -1;
    state = 'running';
    setMediaSession();
    const p = player.play();
    if (p && p.catch) p.catch(() => { state = 'idle'; keepAwake = false; syncWakeLock(); render(); phaseEl.textContent = 'Tryck på Starta'; });
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
    render();
  }

  function finish() {
    keepAwake = false;
    syncWakeLock();
    state = 'done';
    cancelAnimationFrame(raf);
    phaseEl.textContent = 'Klart';
    countEl.textContent = fmt(cycles * cycleLen());
    $('elapsed').textContent = fmt(cycles * cycleLen());
    $('bar').style.width = '100%';
    $('remaining').textContent = '0:00 kvar';
    disc.style.transform = 'scale(0.5)';
    render();
  }

  function stop() {
    keepAwake = false;
    syncWakeLock();
    state = 'idle';
    cancelAnimationFrame(raf);
    player.pause();
    try { player.currentTime = 0; } catch {}
    render();
  }

  player.addEventListener('pause', () => {
    if (state !== 'running' || !player.paused || replacingAudio) return;
    if (player.ended || player.currentTime - LEAD >= cycles * cycleLen()) { finish(); return; }
    state = 'paused';
    cancelAnimationFrame(raf);
    render();
    phaseEl.textContent = 'Paus';
  });
  player.addEventListener('play', () => {
    if (state !== 'paused') return;
    state = 'running';
    raf = requestAnimationFrame(frame);
    render();
  });
  player.addEventListener('ended', () => { if (state === 'running' || state === 'paused') finish(); });

  function preview() {
    if (!R) return;
    const evs = [{ start: Math.round(0.05 * SR), buf: R.in }, { start: Math.round((0.05 + pattern.in) * SR), buf: R.out }];
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = toWavUrl(evs, evs[1].start + R.out.length, audioScale());
    previewer.src = previewUrl;
    const p = previewer.play();
    if (p && p.catch) p.catch(() => {});
  }

  $('times').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    minutes = +b.dataset.min;
    store.set('minutes', minutes);
    if (state === 'done') state = 'idle';
    render();
  });
  $('vol').addEventListener('input', e => {
    volume = +e.target.value;
    store.set('volume', volume);
    $('volumeValue').textContent = Math.round(volume * 100) + ' %';
  });
  $('vol').addEventListener('change', () => {
    if (state === 'running' || state === 'paused') {
      const nextUrl = sessionUrlFor();
      const oldUrl = sessionUrl;
      sessionUrl = nextUrl;
      replaceAudio(player, nextUrl, player.currentTime, state === 'running');
      ctSeen = -1;
      if (oldUrl) URL.revokeObjectURL(oldUrl);
    } else if (!previewer.paused && !previewer.ended) {
      const position = previewer.currentTime;
      const oldUrl = previewUrl;
      const evs = [
        { start: Math.round(0.05 * SR), buf: R.in },
        { start: Math.round((0.05 + pattern.in) * SR), buf: R.out }
      ];
      previewUrl = toWavUrl(evs, evs[1].start + R.out.length, audioScale());
      replaceAudio(previewer, previewUrl, position, true);
      if (oldUrl) URL.revokeObjectURL(oldUrl);
    }
  });
  $('test').addEventListener('click', preview);
  $('start').addEventListener('click', () => {
    if (state === 'running') player.pause();
    else if (state === 'paused') player.play();
    else start();
  });
  $('stop').addEventListener('click', stop);

  render();
  loadBells().then(render, () => { phaseEl.textContent = 'Ljudet kunde inte laddas'; });
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.error);
}
</script>
</body>
